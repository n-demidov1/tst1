[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netspeed"
version = "0.1.0"
description = "Замер скорости интернета: последовательные скачивания одного адреса"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
netspeed = "netspeed.cli:main"

[tool.setuptools]
packages = ["netspeed"]
